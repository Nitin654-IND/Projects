# ===============================
# Server Settings
# ===============================
server.port=8080
# Change this if you want a different port

# ===============================
# Database Settings
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/cloud_storage?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Password

# Driver (MySQL 8+)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# File Upload Settings
# ===============================
# Max file size
spring.servlet.multipart.max-file-size=10MB
# Max request size
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Custom Storage Path (optional)
# Example: store inside your project folder
file.upload-dir=C:/Users/Nitin/Desktop/saveImage

# OR if you want inside project (relative to jar)
# file.upload-dir=./uploads/
